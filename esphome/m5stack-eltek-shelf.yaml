switch:
  # Observe mode: mute EVERY transmission - allocator broadcast, login refresh,
  # discovery login, fault queries and the default-voltage write - so this
  # controller can sit on a bus that another master (a Smartpack controller) is
  # driving, without fighting it for addressing or setpoints. Receive and decode
  # continue normally. State is restored across reboot so a controller already
  # placed in observe mode cannot transmit during its next boot. First boot
  # defaults OFF, preserving the active-controller default.
  - platform: template
    name: "Observe Mode"
    id: observe_mode
    entity_category: diagnostic
    icon: mdi:eye-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # ON  = one shelf-wide setpoint, broadcast on 0x05FF4004 (proven to work).
  # OFF = broadcast suppressed so per-unit frames can be tested; use the
  #       "Apply Per-Unit Setpoints" button to send them.
  - platform: template
    name: "Sync Setpoints"
    id: sync_setpoints
    icon: mdi:link-variant
    optimistic: true
    restore_mode: ALWAYS_ON

  # Efficiency manager: parks surplus rectifiers and rotates which ones run.
  # Defaults OFF - it must be switched on deliberately - but the choice sticks
  # once made. RESTORE_DEFAULT_OFF keeps the saved state in NVS, which survives
  # both reboots and OTA updates, so a shelf left managing itself resumes doing
  # so after a power cut or a firmware push. Only a flash erase (a first serial
  # install, or esptool erase_flash) clears it, which is the one case that
  # genuinely is a fresh install.
  #
  # Caveat: the preference is keyed on a hash of this entity's name, so
  # renaming "Efficiency Manager Enabled" orphans the stored value and the
  # switch silently comes back OFF. Safe direction to fail, but worth knowing.
  - platform: template
    name: "Efficiency Manager Enabled"
    id: efficiency_enabled
    icon: mdi:leaf
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Keep one more rectifier running than strictly needed.
  - platform: template
    name: "Efficiency Redundancy"
    id: efficiency_redundancy
    icon: mdi:shield-plus
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Diagnostic: log every received CAN frame, including ones the normal
  # handlers discard. Read-only - it never transmits - and defaults off
  # because it is chatty (each PSU reports about ten times a second).
  - platform: template
    name: "CAN Sniffer Enabled"
    id: can_sniffer_enabled
    entity_category: diagnostic
    icon: mdi:magnify-scan
    optimistic: true
    restore_mode: ALWAYS_OFF

  # Diagnostic: log this controller's own park/release transmissions. The CAN
  # sniffer above is an on_frame trigger and shows RECEIVED frames only, so
  # without this there is no record of what we actually sent. Off by default.
  - platform: template
    name: "TX Log Enabled"
    id: tx_log_enabled
    entity_category: diagnostic
    icon: mdi:upload-network-outline
    optimistic: true
    restore_mode: ALWAYS_OFF

button:
  - platform: template
    name: "Write Default Voltage To Discovered Rectifiers"
    icon: mdi:content-save
    on_press:
      then:
        - lambda: |-
            if (id(observe_mode).state) {
              ESP_LOGW("eltek", "Observe mode is on - default voltage NOT written");
              return;
            }
            float volts = id(default_voltage).state;
            if (isnan(volts)) return;
            const uint16_t u100 = (uint16_t) lroundf(volts * 100.0f);
            std::vector<uint8_t> data = {
              0x29, 0x15, 0x00,
              (uint8_t) (u100 & 0xFF), (uint8_t) (u100 >> 8)
            };
            // Refresh every login first, then write once: like the set-output
            // frame, the default-voltage write is only honoured on the
            // unit-byte-zero form, so it reaches all logged-in rectifiers.
            for (int slot = 0; slot < 4; slot++) {
              if (!id(rectifier_valid)[slot] || id(rectifier_adopted)[slot]) continue;
              std::vector<uint8_t> login(
                &id(rectifier_serial)[slot * 8], &id(rectifier_serial)[slot * 8] + 8);
              id(eltek).send_data(
                0x05004800 | ((slot + 1) * 4), true, login);
            }
            id(eltek).send_data(0x05009C00, true, data);
            ESP_LOGW("eltek", "Wrote %.2f V default to all discovered rectifiers", volts);

  - platform: template
    name: "Apply Per-Unit Setpoints"
    icon: mdi:tune-vertical
    on_press:
      then:
        - lambda: |-
            // One-shot on purpose: method 2 writes the rectifier's EEPROM, and
            // repeating that at the allocator's 1 Hz would wear its flash out.
            if (id(observe_mode).state) {
              ESP_LOGW("eltek", "Observe mode on - per-unit setpoints NOT sent");
              return;
            }
            if (id(sync_setpoints).state) {
              ESP_LOGW("eltek", "Sync Setpoints is on - turn it off first, or the "
                                "next broadcast overwrites these values");
              return;
            }
            const int method = (int) lroundf(id(per_unit_method).state);
            const uint16_t ovp = (uint16_t) lroundf(${ovp_voltage}f * 100.0f);
            for (int slot = 0; slot < 4; slot++) {
              if (!id(rectifier_valid)[slot]) continue;
              float volts = 48.0f;
              switch (slot) {
                case 0: volts = id(rect_1_voltage).state; break;
                case 1: volts = id(rect_2_voltage).state; break;
                case 2: volts = id(rect_3_voltage).state; break;
                case 3: volts = id(rect_4_voltage).state; break;
              }
              if (isnan(volts)) continue;
              const uint16_t u100 = (uint16_t) lroundf(volts * 100.0f);
              const uint8_t lo = u100 & 0xFF, hi = u100 >> 8;
              const uint32_t unit = slot + 1;
              uint32_t id_ = 0;
              std::vector<uint8_t> data;
              switch (method) {
                case 0:
                  id_ = 0x05004004 | (unit << 16);
                  data = {0xFF, 0xFF, lo, hi, lo, hi,
                          (uint8_t) (ovp & 0xFF), (uint8_t) (ovp >> 8)};
                  break;
                case 1:
                  id_ = 0x05009FFC | (unit << 16);
                  data = {0x29, 0x01, 0x00, lo, hi};
                  break;
                case 2:
                  id_ = 0x05009C00 | (unit << 16);
                  data = {0x29, 0x15, 0x00, lo, hi};
                  break;
                default:
                  id_ = 0x05009800 | (unit << 16);
                  data = {0x21, 0x00, 0x00, lo, hi};
                  break;
              }
              id(eltek).send_data(id_, true, data);
              ESP_LOGW("eltek", "per-unit method %d: sent 0x%08X %.2f V to unit %d",
                       method, id_, volts, (int) unit);
            }

  - platform: template
    name: "Sweep Parameters"
    icon: mdi:magnify-expand
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            static const uint16_t FUNCS[6] = {0x9800, 0x9804, 0x9C00, 0x9FFC, 0xBC00, 0xBFFC};
            if (id(observe_mode).state) {
              ESP_LOGW("sweep", "observe mode on - not sending");
              return;
            }
            const int op = (int) lroundf(id(probe_op).state);
            if (op & 1) {
              ESP_LOGW("sweep", "op 0x%02X is odd (a write) - refusing", op);
              return;
            }
            const int unit = (int) lroundf(id(probe_unit).state);
            int fi = (int) lroundf(id(probe_function).state);
            if (fi < 0 || fi > 5) fi = 3;
            const uint32_t can_id = 0x05000000 | (unit << 16) | FUNCS[fi];
            ESP_LOGW("sweep", "sweeping 0x%08X op 0x%02X selectors 0x00-0x1F", can_id, op);
            for (int sel = 0; sel <= 0x1F; sel++) {
              std::vector<uint8_t> req = {(uint8_t) op, (uint8_t) sel, 0x00};
              id(eltek).send_data(can_id, true, req);
            }

  - platform: template
    name: "Shuffle Now"
    icon: mdi:rotate-3d-variant
    on_press:
      then:
        - lambda: |-
            if (!id(efficiency_enabled).state) {
              ESP_LOGW("eltek", "Shuffle Now ignored - efficiency manager is off");
              return;
            }
            id(force_shuffle) = true;
            ESP_LOGW("eltek", "Shuffle Now: rotation will start on the next tick");

  - platform: restart
    name: "Restart"
