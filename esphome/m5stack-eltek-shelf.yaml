  - platform: template
    name: "Rectifier 1 State"
    update_interval: 1s
    lambda: |-
      if (!id(rectifier_was_online)[0]) return {"Offline"};
      // A parked unit reports 0x10 (walk-in) continuously for as long as
      // it is held at the park voltage - bench-confirmed 2026-08-30. Report
      // the park explicitly so the dashboard does not show a permanent
      // "Walk-in" for a unit that is simply asleep.
      if (id(park_active)[0]) return {"Parked"};
      switch (id(rectifier_state)[0]) {
        case 0x04: return {"Normal"};
        case 0x08:
          // 0x08 only means "some warning bit is set". Bit 7 is Current Limit,
          // which is the unit obeying the limit we gave it - normal constant-
          // current operation, not a fault. Only call it a warning if some
          // other bit is set (or we have not read the bits back yet).
          if (id(rectifier_warn_bits)[0] == 0x0080) return {"Constant current"};
          return {"Warning"};
        case 0x0C: return {"Alarm"};
        case 0x10: return {"Walk-in"};
        default: return {"Unknown"};
