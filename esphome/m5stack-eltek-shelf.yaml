  - platform: template
    name: "Rectifier 1 Faults"
    icon: mdi:alert-circle-outline
    update_interval: 5s
    lambda: |-
      // Names taken from Eltek's own PowerSuite "Detailed rectifier status"
      // table, which lists 16 distinct fields in bit order. The widely-copied
      // community protocol note is wrong for byte 2: it repeats "Mod Fail
      // Secondary" (already byte 1 bit 2) and omits "Low Output Volt".
      // Byte 1 is confirmed empirically - commanding a current limit sets
      // exactly bit 7 and nothing else.
      static const char *NAMES[16] = {
        "OVS Lock Out", "Mod Fail Primary", "Mod Fail Secondary", "High Mains",
        "Low Mains", "High Temp", "Low Temp", "Current Limit",
        "Internal Voltage", "Module Fail", "Fan 1 Speed Low", "Fan 2 Speed Low",
        "Low Output Volt", "Sub Mod1 Fail", "Fan 3 Speed Low", "Inner Volt"};
      if (!id(rectifier_was_online)[0]) return {"Offline"};
      std::string out;
      const uint16_t a = id(rectifier_alarm_bits)[0];
      const uint16_t w = id(rectifier_warn_bits)[0];
      for (int b = 0; b < 16; b++)
        if (a & (1 << b)) { if (!out.empty()) out += ", "; out += "ALARM "; out += NAMES[b]; }
      for (int b = 0; b < 16; b++)
        if (w & (1 << b)) { if (!out.empty()) out += ", "; out += NAMES[b]; }
      if (out.empty()) return {"None"};
      if (out.size() > 250) out.resize(250);
      return {out};
