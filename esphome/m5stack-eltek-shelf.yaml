  - platform: template
    name: "Efficiency State"
    icon: mdi:leaf
    update_interval: 5s
    lambda: |-
      if (!id(efficiency_enabled).state) return {"Disabled"};
      if (id(trans_phase) == 1) {
        char b[48];
        snprintf(b, sizeof(b), "Rotating, parking %d shortly", id(trans_out) + 1);
        return {b};
      }
      // Count units actually in comms, not merely remembered. rectifier_valid
      // persists for a discovered serial even after the shelf is powered down,
      // so counting it reported "2 running" with nothing on the bus at all.
      const uint32_t now = millis();
      int parked = 0, run = 0;
      for (int i = 0; i < 4; i++) {
        if (!id(rectifier_valid)[i]) continue;
        if (id(rectifier_last_seen_ms)[i] == 0 ||
            now - id(rectifier_last_seen_ms)[i] > 3000) continue;
        if (id(park_active)[i]) parked++; else run++;
      }
      if (run + parked == 0) return {"No rectifiers"};
      char b[48];
      snprintf(b, sizeof(b), "%d running, %d parked", run, parked);
      return {b};

