# Optional bidirectional helpers for entering values in box-mode controls.
# Add these list items to automations.yaml. The default ESPHome device slug is
# used; update it to match Settings -> Devices & services -> Entities.

- id: eltek_shelf_apply_float_voltage
  alias: Eltek Shelf Apply Float Voltage
  triggers:
    - trigger: state
      entity_id: input_number.eltek_shelf_float_voltage_setpoint_input
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.state | is_number }}"
  actions:
    - action: number.set_value
      target:
        entity_id: number.m5stack_eltek_shelf_voltage_setpoint
      data:
        value: "{{ trigger.to_state.state | float }}"
  mode: restart

